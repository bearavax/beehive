name: Sync Mātai Manapori

on:
  schedule:
    # Monday 16:20 UTC, Tuesday morning in Wellington. One read of the public API.
    - cron: "20 16 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --experimental-strip-types scripts/sync-wcc.ts
      - id: diff
        run: |
          if git diff --quiet -- src/data/synced/decisions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: decisions
          path: src/data/synced/decisions.json
          retention-days: 1

  open-pr:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: decisions
          path: src/data/synced
      - name: Open a data pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="data/matai-manapori-${GITHUB_RUN_ID}"
          git config user.name "beehive-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add src/data/synced/decisions.json
          git commit -m "Refresh the Mātai Manapori seed"
          git push origin "$branch"
          gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
            --title "Refresh Mātai Manapori seed" \
            --body "Scheduled read of the public Mātai Manapori API for committees 5, 93, 96, and 97. No staff directory and no write routes. Open this only when the normalised decisions changed."
